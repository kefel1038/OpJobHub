
name: Daily Qatar Jobs Autonomous Pipeline

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:
    inputs:
      source:
        description: "Scrape specific source (leave empty for all)"
        required: false
        type: string

      dry-run:
        description: "Run cleanup in dry-run mode (no destructive actions)"
        required: false
        type: boolean
        default: false

concurrency:
  group: scrape-jobs
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  SCRAPER_DEBUG_DIR: /tmp/scraper-debug
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:
  daily-pipeline:
    name: Daily Job Ingestion Pipeline

    # Prevent GitHub from selecting Ubuntu 26.04
    runs-on: ubuntu-24.04

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
- uses: pnpm/action-setup@v6
- uses: actions/setup-node@v7
  with:
    node-version: 24
    cache: "pnpm"
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Playwright version
        run: pnpm --filter @workspace/api-server exec playwright --version

      - name: Install Playwright Chromium
        run: pnpm --filter @workspace/api-server exec playwright install --with-deps chromium

      - name: Sync database schema
        run: pnpm --filter @workspace/db run migrate-columns

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Run scraper
        run: pnpm --filter @workspace/api-server run scrape
        env:
          SCRAPE_SOURCE: ${{ inputs.source || '' }}

      - name: Run lifecycle cleanup
        run: pnpm --filter @workspace/api-server run lifecycle:cleanup
        env:
          CLEANUP_ARCHIVE_DAYS: ${{ vars.CLEANUP_ARCHIVE_DAYS || '30' }}
          CLEANUP_DELETE_DAYS: ${{ vars.CLEANUP_DELETE_DAYS || '60' }}
          CLEANUP_DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}

      - name: Recompute freshness scores
        run: pnpm --filter @workspace/api-server run lifecycle:freshness

      - name: Update scraper health metrics
        run: pnpm --filter @workspace/api-server run lifecycle:health

      - name: Generate daily report
        run: pnpm --filter @workspace/api-server run lifecycle:report

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-${{ github.run_id }}
          path: /tmp/scraper-debug/
          retention-days: 7
          if-no-files-found: ignore

      - name: Log completion
        if: always()
        run: |
          echo "=========================================="
          echo "  Daily Qatar Jobs Pipeline"
          echo "  Timestamp: $(date -u)"
          echo "  Run ID: ${{ github.run_id }}"
          echo "=========================================="
