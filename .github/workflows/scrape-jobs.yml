name: Daily Qatar Jobs Scraper

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Scrape specific source (leave empty for all)"
        required: false
        type: string

concurrency:
  group: scrape-jobs
  cancel-in-progress: true

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  SCRAPER_DEBUG_DIR: /tmp/scraper-debug

jobs:
  scrape:
    name: Scrape Qatar Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run scraper
        run: pnpm --filter @workspace/api-server run scrape
        env:
          SCRAPE_SOURCE: ${{ github.event.inputs.source || '' }}

      - name: Cleanup expired jobs
        run: pnpm --filter @workspace/api-server run scrape:cleanup

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-${{ github.run_id }}
          path: /tmp/scraper-debug/
          retention-days: 7

      - name: Log completion
        run: echo "Scrape completed at $(date)"
